name = "layover-legends-cdn-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# Secrets (set via `npx wrangler secret put NAME`):
#   SUPABASE_PROJECT_REF — e.g. "idgobxvhbhdymfsfmhae"
#
# Custom domain — wrangler will attach this on the next `wrangler deploy`,
# auto-creating the necessary CNAME/AAAA records on the Cloudflare zone for
# layover-legends.com. Account must own the zone (it does — we set up CAA
# records earlier in Phase 9c).
routes = [
  { pattern = "cdn.layover-legends.com", zone_name = "layover-legends.com", custom_domain = true }
]
